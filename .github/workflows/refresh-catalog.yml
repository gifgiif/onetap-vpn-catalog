name: Refresh server catalog

on:
  workflow_dispatch:
  # Checker changes need a fresh signed snapshot immediately; publishing the
  # resulting public/catalog.json does not match these paths, so this cannot
  # trigger a refresh loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-catalog.yml'
      - 'cmd/publish/**'
      - 'internal/**'
  schedule:
    # Offset from the top of the hour, when scheduled GitHub jobs are often busy.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  # A delayed scheduled run must never hold up a newer snapshot. The normal
  # check completes in about a minute; cancelling an old queued run gives the
  # newest source view priority when GitHub's scheduler catches up late.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      # Pinned to immutable upstream commits; tags alone can move.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
      - name: Verify catalog replacement and checker logic
        run: go test ./internal/...
      - name: Download pinned Xray core
        env:
          XRAY_VERSION: v25.8.3
          XRAY_SHA256: f3f69cdccdf3443f25248f65bec0f621a7bd05c9d6fbbd5d9f064a8fce70f0fc
        run: |
          curl --fail --location --retry 3 --output xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  xray.zip" | sha256sum --check --strict
          unzip -q xray.zip xray
          chmod 0755 xray
      - name: Check public VLESS candidates and sign catalog
        shell: bash
        env:
          CATALOG_SIGNING_PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY }}
          XRAY_BIN: ${{ github.workspace }}/xray
          CATALOG_OUTPUT: public/catalog.json
        run: |
          set -euo pipefail
          # A transient GitHub, source-feed or probe-endpoint error must not
          # leave the last snapshot in place until the next scheduled event.
          # Publishing itself is atomic, so a failed attempt cannot replace
          # the known-good catalog.
          for attempt in 1 2 3; do
            if go run ./cmd/publish; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 20))"
            fi
          done
          exit 1
      - name: Publish only a changed catalog
        run: |
          if test -z "$(git status --porcelain -- public/catalog.json)"; then exit 0; fi
          git config user.name 'OneTap catalog bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/catalog.json
          git commit -m 'Refresh verified server catalog'
          git push
